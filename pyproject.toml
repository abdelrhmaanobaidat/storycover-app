[project]
name = "storycover"
version = "0.1.0"
description = "Upload a photo and a story name, get a generated story-book cover."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "google-genai>=1.0",
    "google-cloud-storage>=2.18",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storycover"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
